<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morsecode-Detektive Quiz</title>
    <!-- Konfetti Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --correct-color: #2ecc71;
            --primary-color: #2c3e50;
            --error-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #header-box {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 25px;
            max-width: 650px;
            width: 100%;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.8rem; color: #2c3e50; }
        p { margin: 5px 0 0 0; color: #555; font-weight: 500; }

        #quiz-wrapper {
            position: relative;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
        }

        /* Capybara Dekorationen */
        .capy-decor {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            width: 110px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.1));
        }

        .capy-left-top     { left: -135px; top: -10px; }
        .capy-right-top    { right: -135px; top: -10px; }
        .capy-left-mid     { left: -135px; top: 40%; }
        .capy-right-mid    { right: -135px; top: 40%; }
        .capy-left-bottom  { left: -135px; bottom: -10px; }
        .capy-right-bottom { right: -135px; bottom: -10px; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .word-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            gap: 5px;
        }

        .morse-code-display {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.95rem;
            color: #34495e;
            background-color: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease;
            background-color: #ffffff;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        input.correct {
            border-color: var(--correct-color) !important;
            background-color: #e8f8f5;
            color: #196f3d;
            font-weight: bold;
        }

        .status-icon {
            width: 24px;
            font-size: 1.2rem;
            text-align: center;
        }

        #check-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.2s ease;
        }

        #check-btn:hover {
            background-color: #2980b9;
        }

        /* Ergebnisbereich mit grünem Rahmen */
        #result-box {
            display: none;
            margin-top: 25px;
            background: #ffffff;
            border: 3px solid var(--correct-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
        }

        .green-check {
            font-size: 5rem;
            color: var(--correct-color);
            line-height: 1;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .solution-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .hint-text {
            font-size: 1.1rem;
            color: #27ae60;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="header-box">
        <h1>MORSECODE-DETEKTIVE</h1>
        <p>Themenbereich: Kunst & Geheimschriften</p>
    </div>

    <div id="quiz-wrapper">
        <!-- Capybara Dekorationen -->
        <img src="IMG_5385.jpeg" class="capy-decor capy-left-top" alt="Capybara mit Herzen">
        <img src="IMG_5395.jpeg" class="capy-decor capy-right-top" alt="Capybara mit Kleeblatt">
        <img src="IMG_5397.jpeg" class="capy-decor capy-left-mid" alt="Capybara mit Bubble Tea">
        <img src="IMG_5398.jpeg" class="capy-decor capy-right-mid" alt="Capybara mit Gebäck">
        <img src="IMG_5400.jpeg" class="capy-decor capy-left-bottom" alt="Capybara mit Pizza">
        <img src="IMG_5401.jpeg" class="capy-decor capy-right-bottom" alt="Capybara mit Blumenkorb">

        <div id="quiz-list"></div>
        <button id="check-btn" onclick="checkAnswers()">Eingaben überprüfen</button>
    </div>

    <div id="result-box">
        <div class="green-check">✔</div>
        <div class="solution-text" id="generated-solution"></div>
        <div class="hint-text">Dies ist der Hinweis für die nächste Station</div>
    </div>

    <script>
        const QUESTIONS = [
            {
                section: "Teil 1: Die Geheimbotschaft",
                code: "-.- ..-- -. ... - / -- .- -.-. .... - / ... .--. .- ... ... !",
                solution: "KUNST MACHT SPASS!",
                required: true
            },
            {
                section: "Teil 2: Wohin führt dich die Spur? (Finaler Hinweis)",
                code: "..- -- / -.. .- ... / -. .- . -.-. .... ... - . / .-. .- . - ... . .-.. / --.. ..- / .-.. --- . ... . -. / -- ..- ... ... - / -.. ..- / -.. .- .... . .-. / --.. ..- -- / .--. .-. --- .--- . -.- - / -- .. -. .. .- - ..- .-. ..-. --- - --- --. .-. .- .--. .... .. . .--.",
                solution: "UM DAS NAECHSTE RAETSEL ZU LOESEN MUSST DU DAHER ZUM PROJEKT MINIATURFOTOGRAFIE.",
                required: true
            },
            {
                section: "Extralevel Bonusaufgaben (Freiwillig)",
                code: "-.- ..-- -. ... - / -- .- -.-. .... - / ..- -. ... / .. -- -- . .-. / ... . .... .-. / ...- .. . .- . / ... .--. .- ... ... .--.",
                solution: "KUNST MACHT UNS IMMER SEHR VIEL SPASS.",
                required: false
            },
            {
                section: "Extralevel Bonusaufgaben (Freiwillig)",
                code: "-.. --- .-. - / -- .- .-.. . -. / ..- -. -.. / --.. . .. -.-. .... -. . -. / .-- .. .-. / ...- .. . .- ..",
                solution: "DORT MALEN UND ZEICHNEN WIR VIEL.",
                required: false
            },
            {
                section: "Extralevel Bonusaufgaben (Freiwillig)",
                code: "-.. --- .--. .--. . .- . ... - ..- -. -.. . -. / -- .- -.-. .... . -. / -- . .... .-. / ... .--. .- ... ... / .-- . .. .- . / -- .- -. / -- . .... .-. / --.. . .. - / .... .- - .--.",
                solution: "DOPPELSTUNDEN MACHEN MEHR SPASS WEIL MAN MEHR ZEIT HAT.",
                required: false
            },
            {
                section: "Extralevel Bonusaufgaben (Freiwillig)",
                code: "-.- ..-- -. ... - / -.- .- -. -. / .- -... . .-. / .- ..- -.-. .... / ...- .. . .- . / .- -. -.. . .-. . ... / ... . .. -. .--.",
                solution: "KUNST KANN ABER AUCH VIEL ANDERES SEIN.",
                required: false
            }
        ];

        const quizListEl = document.getElementById('quiz-list');
        const resultBox = document.getElementById('result-box');
        const generatedSolutionEl = document.getElementById('generated-solution');

        function initQuiz() {
            let currentSection = "";

            QUESTIONS.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-title';
                    sectionHeader.innerText = currentSection;
                    quizListEl.appendChild(sectionHeader);
                }

                const row = document.createElement('div');
                row.className = 'word-row';

                const placeholderText = item.required ? "Klartext eingeben (Pflicht)..." : "Klartext eingeben (Optional)...";

                row.innerHTML = `
                    <div class="morse-code-display">${item.code}</div>
                    <div class="input-container">
                        <input type="text" id="input-${index}" placeholder="${placeholderText}" autocomplete="off">
                        <div class="status-icon" id="status-${index}"></div>
                    </div>
                `;
                quizListEl.appendChild(row);
            });
        }

        function triggerConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function normalizeText(text) {
            return text.trim().toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
        }

        function checkAnswers() {
            let requiredCorrect = true;

            QUESTIONS.forEach((item, index) => {
                const inputEl = document.getElementById(`input-${index}`);
                const statusEl = document.getElementById(`status-${index}`);
                const userVal = inputEl.value;

                if (userVal.trim() === "") {
                    inputEl.classList.remove('correct');
                    statusEl.innerText = "";
                    if (item.required) {
                        requiredCorrect = false;
                    }
                } else if (normalizeText(userVal) === normalizeText(item.solution)) {
                    inputEl.classList.add('correct');
                    statusEl.innerText = "✔";
                    statusEl.style.color = "#2ecc71";
                } else {
                    inputEl.classList.remove('correct');
                    statusEl.innerText = "✖";
                    statusEl.style.color = "#e74c3c";
                    if (item.required) {
                        requiredCorrect = false;
                    }
                }
            });

            if (requiredCorrect) {
                generatedSolutionEl.innerText = `Ziel-Station: "PROJEKT MINIATURFOTOGRAFIE"`;
                resultBox.style.display = "block";
                resultBox.scrollIntoView({ behavior: 'smooth' });
                triggerConfetti();
            } else {
                resultBox.style.display = "none";
            }
        }

        initQuiz();
    </script>
</body>
</html>
